# Runs api/player_scraping.py on a schedule and commits estatisticas.json.
# Vercel's Git integration redeploys the site on every push to main.
name: Atualizar estatisticas

on:
  schedule:
    - cron: "59 23 * * 0" # every Sunday at 23:59 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: atualizar-estatisticas
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 lxml python-dotenv

      - name: Run scraper
        env:
          basketapi_user: ${{ secrets.BASKETAPI_USER }}
          basketapi_pass: ${{ secrets.BASKETAPI_PASS }}
        run: python api/player_scraping.py < /dev/null

      - name: Commit and push if the stats changed
        run: |
          # Ignore the "atualizado" timestamp so we only push when the numbers change
          if git diff --quiet -I '"atualizado"' -- estatisticas.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estatisticas.json
          git commit -m "Atualizar estatisticas ($(date -u +%Y-%m-%d))"
          git push
